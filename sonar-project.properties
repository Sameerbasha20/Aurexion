# SonarCloud Project Configuration for Aurexion Technologies
sonar.projectKey=VPDTechnologies_Aurexion_technologies
sonar.organization=vpdtechnologies
sonar.projectName=Aurexion Enterprise Platform
sonar.projectVersion=1.0.0

# Source and Test Directories
sonar.sources=src,frontend/src
sonar.tests=tests
sonar.test.inclusions=tests/**,test_*.py,**/*test*.py,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# Character Encoding
sonar.sourceEncoding=UTF-8

# Python Coverage Report Configuration
sonar.python.version=3.11,3.12,3.13,3.14
sonar.python.coverage.reportPaths=coverage.xml

# JavaScript / TypeScript Coverage Report Configuration
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# Exclusions
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/__pycache__/**,\
  **/.pytest_cache/**,\
  **/.system_generated/**,\
  db.sqlite3,\
  *.log,\
  scripts/**,\
  docs/**,\
  schema.yml

# Duplication Exclusions
sonar.cpd.exclusions=\
  **/*test*/**,\
  **/tests/**,\
  **/docs/**,\
  **/data/**,\
  **/features/public/pages/Legal/**
