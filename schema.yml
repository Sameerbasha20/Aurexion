openapi: 3.0.3
info:
  title: Aurexion Enterprise Platform API
  version: 1.0.0
  description: API documentation for Aurexion Technologies platform.
paths:
  /api/v1/audit-logs/:
    get:
      operationId: audit_logs_list
      description: |-
        Endpoint: /api/v1/audit-logs/
        Allows Super Admins to view and search audit events.
        Immutable log: read-only actions (list and retrieve) only.
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - audit-logs
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditLog'
          description: ''
  /api/v1/audit-logs/{id}/:
    get:
      operationId: audit_logs_retrieve
      description: |-
        Endpoint: /api/v1/audit-logs/
        Allows Super Admins to view and search audit events.
        Immutable log: read-only actions (list and retrieve) only.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this audit log.
        required: true
      tags:
      - audit-logs
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLog'
          description: ''
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      description: |-
        Endpoint: POST /api/v1/auth/login/
        Allows users to log in and obtain JWT access and refresh tokens.
        Implements a lockout after 5 failed attempts per user or per IP.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
