components:
  schemas:
    AdminCandidateApplication:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        tracking_code:
          type: string
          readOnly: true
        first_name:
          type: string
          maxLength: 100
        last_name:
          type: string
          maxLength: 100
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type: string
          maxLength: 20
        resume_storage_path:
          type: string
          readOnly: true
        stage:
          $ref: '#/components/schemas/ApplicationStageEnum'
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        job_vacancy:
          type: integer
      required:
      - created_at
      - email
      - first_name
      - id
      - job_vacancy
      - last_name
      - phone
      - resume_storage_path
      - tracking_code
      - updated_at
    AdminJobVacancy:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        job_id:
          type: string
          maxLength: 50
        title:
          type: string
          maxLength: 200
        department:
          type: string
          maxLength: 100
        location:
          type: string
          maxLength: 100
        experience:
          type: string
          maxLength: 100
        skills:
          type: string
        responsibilities:
          type: string
        status:
          $ref: '#/components/schemas/JobStatusEnum'
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - department
      - experience
      - id
      - job_id
      - location
      - responsibilities
      - skills
      - title
      - updated_at
    AdministratorTicketUpdate:
      type: object
      properties:
        subject:
          type: string
          maxLength: 255
        category:
          $ref: '#/components/schemas/CategoryEnum'
        priority:
          $ref: '#/components/schemas/PriorityE88Enum'
        status:
          $ref: '#/components/schemas/StatusA61Enum'
        assigned_to:
          type: integer
          nullable: true
        resolution_notes:
          type: string
        client_user:
          type: integer
      required:
      - client_user
      - subject
    ApplicationNote:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        note:
          type: string
        author_name:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - author_name
      - created_at
      - id
      - note
    ApplicationStageEnum:
      enum:
      - RECEIVED
      - SHORTLISTED
      - INTERVIEWED
      - OFFERED
      - REJECTED
      type: string
      description: |-
        * `RECEIVED` - Received
        * `SHORTLISTED` - Shortlisted
        * `INTERVIEWED` - Interviewed
        * `OFFERED` - Offered
        * `REJECTED` - Rejected
    Apply:
      type: object
      properties:
        job_id:
          type: string
          maxLength: 50
        first_name:
          type: string
          maxLength: 100
        last_name:
          type: string
          maxLength: 100
        email:
          type: string
          format: email
        phone:
          type: string
          maxLength: 20
        resume:
          type: string
          format: uri
      required:
      - email
      - first_name
      - job_id
      - last_name
      - phone
      - resume
    AuditLog:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user_username:
          type: string
          readOnly: true
        action:
          type: string
          maxLength: 50
        module:
          type: string
          maxLength: 100
        object_id:
          type: string
          nullable: true
          maxLength: 255
        repr:
          type: string
          nullable: true
        previous_state:
          nullable: true
        updated_state:
          nullable: true
        ip_address:
          type: string
          nullable: true
        user_agent:
          type: string
          nullable: true
        timestamp:
          type: string
          format: date-time
          readOnly: true
        user:
          type: integer
          nullable: true
      required:
      - action
      - id
      - module
      - timestamp
      - user_username
    BdmDashboard:
      type: object
      description: Response shape of the BDM dashboard endpoint.
      properties:
        total_leads:
          type: integer
        assigned_leads:
          type: integer
        unassigned_leads:
          type: integer
        new_leads:
          type: integer
        qualified_leads:
          type: integer
        active_opportunities:
          type: integer
        overdue_follow_ups:
          type: integer
        won_leads:
          type: integer
        lost_leads:
          type: integer
        conversion_rate:
          type: number
          format: double
        pipeline_summary:
          type: array
          items:
            $ref: '#/components/schemas/BdmPipelineSummary'
        recent_activities:
