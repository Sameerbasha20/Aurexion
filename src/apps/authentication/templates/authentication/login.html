{% extends 'base.html' %}

{% block title %}Login | Aurexion Enterprise{% endblock %}

{% block content %}
<div class="login-wrapper">
    <div class="login-card glass-panel">
        <div class="brand-header">
            <div class="brand-logo">
                <i class="fa-solid fa-shield-halved"></i> Aurexion
            </div>
            <div class="brand-tagline">Enterprise Administration System</div>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="alert-box alert-{% if message.tags == 'error' %}error{% else %}success{% endif %}">
                    <i class="fa-solid {% if message.tags == 'error' %}fa-circle-exclamation{% else %}fa-circle-check{% endif %}"></i>
                    <span>{{ message }}</span>
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST" action="{% url 'portal:login' %}">
            {% csrf_token %}
            <div class="form-group">
                <label for="username" class="form-label">Username</label>
                <div class="input-icon-wrapper">
                    <input type="text" id="username" name="username" class="form-control" placeholder="Enter username" required autocomplete="username">
                    <i class="fa-solid fa-user"></i>
                </div>
            </div>

            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <div class="input-icon-wrapper">
                    <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
                    <i class="fa-solid fa-lock"></i>
                </div>
            </div>

            <button type="submit" class="btn">
                <span>Sign In</span>
                <i class="fa-solid fa-arrow-right-to-bracket"></i>
            </button>
        </form>
    </div>
</div>
{% endblock %}
