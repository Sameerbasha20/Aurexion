name: Tests
on:
  workflow_dispatch: {}
jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      # No .env exists in CI; DEBUG=True uses the development-only SECRET_KEY
      # fallback so the suite runs without a real secret being committed.
      DEBUG: 'True'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip==24.0 && pip install --no-cache-dir -r requirements.txt
      - name: Run test suite with coverage
        run: |
          python -m coverage run manage.py test --noinput
          python -m coverage xml -o coverage.xml
